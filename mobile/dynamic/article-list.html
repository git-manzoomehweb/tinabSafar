<basis
  core="dbsource"
  source="basiscore"
  name="db"
  mid="1"
  lid="1"
  catid="[##cms.query.nid|(213766)##]"
>
  <member
    name="nid-list"
    link="article.bc"
    size="96x96"
    propertyid="7244"
    type="list"
  />
</basis>
<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover"
    />
    <title>
      [##cms.seo.title|(شرکت خدمات مسافرت هوایی و گردشگری تیناب سفر پارسه)##]
    </title>
    <meta
      name="description"
      content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  تیناب سفر پارسه)##]"
    />
    <basis
      core="dbsource"
      source="hosting"
      name="tag"
      urlid="[##cms.seo.urlid##]"
    >
      <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
      <face filter="key = 'canonical'">
        <link rel="canonical" href="@value" />
      </face>
      <face>
        <meta property="@key" content="@value" />
      </face>
    </basis>
    <basis core="call" file="pwa.inc" />
    <basis core="call" file="style.inc" />
    <link
      rel="stylesheet"
      href="https://cdn.basiscore.net/basisfly.com/css/swiper-bundle.min.css"
    />
  </head>
  <body class="relative">
    <basis core="call" file="header.inc" />
    <main class="w-full">
      <section
        class="w-full flex flex-col relative gap-4 h-[208px] bg-cover bg-no-repeat bg-center justify-center items-center"
      >
        <basis core="print" datamembername="db.bannerimage">
          <face filter="image is null">
            <img
              loading="lazy"
              src="[##cms.cms.cdn##]/images/article-bg.jpg"
              alt="banner"
              class="w-full h-full object-cover"
            />
          </face>
          <face>
            <img
              loading="lazy"
              loading="lazy"
              src="@image"
              alt="@title"
              class="w-full h-full object-cover"
            />
          </face>
        </basis>
        <div
          class="absolute top-0 left-0 w-full h-full flex flex-col gap-6 justify-center items-center"
        >
          <basis core="print" datamembername="db.scalar">
            <face>
              <h1 class="text-white font-bold text-base">@column1</h1>
            </face>
          </basis>

          <ul class="flex gap-1 items-center">
            <li class="text-white text-sm hover:!text-primary-900">
              <a href="/">صفحه اصلی</a>
            </li>
            <li class="text-white text-sm">></li>
            <basis core="print" datamembername="db.navigation">
              <face filter="RowNumber=max(RowNumber) and parentcatid<>212229">
                <li
                  class="text-white text-sm"
                  itemprop="itemListElement"
                  itemscope
                  itemtype="https://schema.org/ListItem"
                >
                  <span itemprop="name">@title</span
                  ><meta itemprop="position" content="@rownumber" />
                </li>
              </face>
              <face filter="link is null and parentcatid<>212229">
                <li
                  class="text-white text-sm hover:!text-primary-900"
                  itemprop="itemListElement"
                  itemscope
                  itemtype="https://schema.org/ListItem"
                >
                  <a
                    class="text-white text-sm hover:!text-primary-900"
                    itemprop="item"
                    href="/tour-list.bc?catid=@parentcatid"
                    aria-label="@title"
                    ><span itemprop="name">@title</span
                    ><meta itemprop="position" content="@rownumber"
                  /></a>
                  <span class="text-white text-sm"> > </span>
                </li>
              </face>
              <face filter="parentcatid<>212229">
                <li
                  class="text-white text-sm hover:!text-primary-900"
                  itemprop="itemListElement"
                  itemscope
                  itemtype="https://schema.org/ListItem"
                >
                  <a
                    class="text-white text-sm hover:!text-primary-900"
                    itemprop="item"
                    href="@link"
                    aria-label="@title"
                    ><span class="text-white" itemprop="name">@title</span
                    ><meta itemprop="position" content="@rownumber"
                  /></a>
                  <span class="text-white text-sm"> > </span>
                </li>
              </face>
            </basis>
          </ul>
        </div>
      </section>

      <section class="w-full flex justify-center mt-4 relative">
        <div
          class="px-5 z-[2] flex flex-col-reverse gap-4 lg:!px-0 w-full lg:w-[950px] xl:w-[1200px] 2xl:w-[1280px]"
        >
          <div class="w-full flex flex-col gap-3">
            <div
              data-catid="[##cms.query.catid##]"
              class="w-full fetch-content-categories flex flex-col items-center"
            ></div>

            <basis core="print" datamembername="db.nid-list">
              <layout>
                <div
                  class="w-full flex flex-col gap-4 p-4 rounded-lg bg-white border border-zinc-300"
                >
                  <p
                    class="text-primary-900 font-bold pb-3 border-b border-zinc-200"
                  >
                    آخرین مطالب
                  </p>
                  @child
                </div>
              </layout>
              <face filter="link is null">
                <a href="/article.bc?lid=1&id=@id" class="flex gap-2 w-full">
                  <img
                    loading="lazy"
                    class="w-[27%] h-[96px] rounded-lg"
                    width="96"
                    height="96"
                    src="@image"
                    alt="@title"
                  />
                  <div
                    class="w-[73%] flex flex-col p-3 h-[94px] gap-2 bg-secondary-50 border border-secondary-100 rounded-lg"
                  >
                    <p class="line-clamp-1 text-zinc-900 font-medium">@title</p>
                    <p class="line-clamp-2 text-zinc-900 !text-sm">@prp_7244</p>
                  </div>
                </a>
              </face>
              <face>
                <a href="@link" class="flex gap-2 w-full">
                  <img
                    loading="lazy"
                    class="w-[27%] h-[96px] rounded-lg"
                    width="96"
                    height="96"
                    src="@image"
                    alt="@title"
                  />
                  <div
                    class="w-[73%] flex flex-col p-3 h-[94px] gap-2 bg-secondary-50 border border-secondary-100 rounded-lg"
                  >
                    <p class="line-clamp-1 text-zinc-900 font-medium">@title</p>
                    <p class="line-clamp-2 text-zinc-900 !text-sm">@prp_7244</p>
                  </div>
                </a>
              </face>
            </basis>
          </div>
          <div class="w-full flex flex-col gap-3">
            <form
              action="/article-search-content.bc"
              method="get"
              class="w-full flex gap-2 h-[64px] justify-center items-center bg-white border rounded-lg border-zinc-300 px-3"
            >
              <input
                autocomplete="off"
                aria-label="search-article"
                name="search-content-name"
                placeholder="جستجو"
                class="w-[90%] text-primary-900 placeholder:text-primary-900 h-full bg-transparent focus:outline-none focus:border-0 border-0 outline-none"
                type="text"
                required
              />
              <button class="w-[10%] hovered h-full" type="submit">
                <img
                  loading="lazy"
                  class="w-[20px] h-[20px]"
                  width="40"
                  height="40"
                  src="../../images/SearchIcon.png"
                  alt="SearchIcon"
                />
              </button>
            </form>
            <basis
              core="tree"
              datamembername="tourism-magazine.cat"
              idcol="catid"
              parentidcol="parentid"
              nullvalue="212320"
            >
              <layout>
                <div
                  class="w-full flex flex-col gap-4 filtering-box p-4 rounded-lg bg-white border border-zinc-300 h-fit"
                >
                  <p class="text-primary-900 font-bold mb-3">شهر/کشور</p>

                  <ul class="w-full flex flex-col gap-8">
                    @child
                  </ul>
                </div>
              </layout>
              <face level="end" filter="link is null">
                <li
                  class="flex text-zinc-900 items-center gap-3 cursor-pointer"
                >
                  <input
                    type="radio"
                    name="radio"
                    value="@catid"
                    id="@catid"
                    class="size-5 accent-secondary-200"
                    aria-label="radio-btn"
                  />
                  <label class="text-zinc-900" for="@catid">@title</label>
                </li>
              </face>
              <face level="end">
                <li
                  class="flex text-zinc-900 items-center gap-3 cursor-pointer"
                >
                  <input
                    type="radio"
                    name="radio"
                    value="@catid"
                    id="@catid"
                    class="size-5 accent-secondary-200"
                    aria-label="radio-btn"
                  />
                  <label class="text-zinc-900" for="@catid">@title</label>
                </li>
              </face>
            </basis>
          </div>
        </div>
      </section>
    </main>
    <basis core="call" file="footer.inc" />
  </body>
</html>
