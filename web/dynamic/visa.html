<basis
  core="dbsource"
  source="basiscore"
  lid="1"
  mid="1"
  name="db"
  usedforid="2375571"
>
  <member
    name="visa-desc"
    type="view"
    propertyid="7244"
    perpage=""
    typeid="159"
    order="ord"
  />
</basis>
<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover"
    />
    <title>
      [##cms.seo.title|(شرکت خدمات مسافرت هوایی و گردشگری تیناب سفر پارسه)##]
    </title>
    <meta
      name="description"
      content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  تیناب سفر پارسه)##]"
    />
    <basis
      core="dbsource"
      source="hosting"
      name="tag"
      urlid="[##cms.seo.urlid##]"
    >
      <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
      <face filter="key = 'canonical'">
        <link rel="canonical" href="@value" />
      </face>
      <face>
        <meta property="@key" content="@value" />
      </face>
    </basis>
    <basis core="call" file="pwa.inc" />
    <basis core="call" file="style.inc" />
    <link
      rel="stylesheet"
      href="https://cdn.basiscore.net/basisfly.com/css/swiper-bundle.min.css"
    />
  </head>
  <body class="relative">
    <basis core="call" file="header.inc" />
    <main class="w-full flex flex-col mt-10 items-center">
      <div
        class="w-full relative lg:w-[950px] xl:w-[1200px] 2xl:w-[1280px] flex flex-col items-start gap-7"
      >
        <ul class="flex items-center">
          <li class="text-sm text-primary-900 hover:text-secondary-800">
            <a href="/">صفحه اصلی</a>
          </li>
          <li class="text-sm text-primary-900 px-[3px]">></li>
          <li class="text-sm text-primary-900">فرم درخواست ویزا</li>
        </ul>
        <div class="flex gap-3">
          <img
            width="120"
            height="121"
            src="../../images/visa-book.png"
            alt="visa"
            class="w-[40px] h-[40px]"
          />
          <h1 class="text-3xl text-primary-900 font-bold">فرم درخواست ویزا</h1>
        </div>
        <basis core="print" datamembername="db.visa-desc">
          <face filter="valueID<>4125709">
            <p class="text-sm">@Answer</p>
          </face>
        </basis>

        <span class="absolute top-[10%] mt-20 -right-24 z-0">
          <img
            width="858"
            height="848"
            class="w-[285px] h-[95px]"
            src="../../images/abs-lng.png"
            alt=""
          />
        </span>
        <span class="absolute top-[40%] -left-28 z-0">
          <img
            width="858"
            height="848"
            class="w-[285px] h-[95px]"
            src="../../images/abs-lng.png"
            alt=""
          />
        </span>
        <div
          class="w-full z-[2] flex flex-col gap-4 bg-background-1 rounded-lg border border-zinc-300 p-5 mb-10"
        >
          <div class="items-container" id="visa-form">
            <div class="bc-main">
              <div class="free-form-container">
                <basis
                  core="schema"
                  run="atclient"
                  schemaurl="/schema/domainform/5ED86DAC-A44F-411F-9A2B-AF8F0A338231/F7F0E955-B690-4B64-B3C4-8386C0046AB5/fa/فرم-درخواست-ویزا"
                  displaymode="new"
                  button="[data-btn-upload]"
                  resultsourceid="upload.data"
                  OnRendered="RenderFormVisa"
                >
                </basis>
                <basis
                  core="api"
                  if="{##cms.upload.run|(false)##}"
                  run="atclient"
                  url="/schema/domainform/5ED86DAC-A44F-411F-9A2B-AF8F0A338231/fa/editobject"
                  method="post"
                  body="object_edit={##cms.upload.value##}&captcha={##cms.upload.captcha##}&captchaid={##cms.upload.captchaid##}"
                  content-type="application/x-www-form-urlencoded"
                  triggers="cms.upload"
                  OnProcessed="OnProcessedEditObject"
                >
                </basis>
              </div>
              <basis
                core="callback"
                run="atclient"
                method="uploadDocument"
                if="{##cms.run.value|(false)##}"
                triggers="upload.data"
              ></basis>

              <div class="message-api text-center font_20 font-weight"></div>
              <div class="clr"></div>
            </div>
          </div>
          <div class="flex w-full justify-center">
            <div
              class="free-form-content lg:w-[950px] xl:w-[1200px] 2xl:w-[1280px] flex flex-col gap-3 mt-[68px]"
            >
              <div class="mt-7">
                <input type="checkbox" class="confirm-form" />
                اینجانب ضمن تایید موارد و اطلاعات فوق ، بدینوسیله موارد بالا را
                تصدیق می نمایم.
              </div>

              <div class="validate-alert hidden">
                لطفا قوانین و مقررات را تایید فرمایید
              </div>
              <div
                id="captchaContainer"
                class="captchaContainerclass !flex items-center gap-[10px] !w-full captcha-sefaresh"
                data-bc-answer-container
                data-bc-schema-info-multi="0"
                data-bc-schema-info-word="58"
                data-bc-schema-info-part="1"
                data-bc-schema-info-part-0-type="text"
              >
                <basis
                  core="dbsource"
                  source="trust_login"
                  name="captcha"
                  run="atclient"
                  triggers="captcha.refresh"
                >
                  <member name="code1" type="scalar" request="captcha"></member>
                </basis>

                <basis
                  datamembername="captcha.code1"
                  core="print"
                  run="atclient"
                  OnRendered="captchaRendered"
                >
                  <face>
                    <script type="text/template">
                      <div class='flex !w-full'>
                          <div class="w-full">
                              <input type="text" class="contactUsInput codeinputm" name="captcha" maxlength="4" />
                              <input type="hidden" name="captchaid" value="@captcha@" />
                          </div>
                          <div class="flex gap-2 flex-row-reverse items-center px-3">
                              <svg class="cursor-pointer" width="35" height="25" onclick="refreshCaptcha()" viewBox="0 0 16 17" fill="none"
                              xmlns="http://www.w3.org/2000/svg">
                              <path
                                  d="M13.6498 3.34999C12.0198 1.71999 9.70978 0.779992 7.16978 1.03999C3.49978 1.40999 0.479777 4.38999 0.0697772 8.05999C-0.480223 12.91 3.26978 17 7.99978 17C11.1898 17 13.9298 15.13 15.2098 12.44C15.5298 11.77 15.0498 11 14.3098 11C13.9398 11 13.5898 11.2 13.4298 11.53C12.2998 13.96 9.58978 15.5 6.62978 14.84C4.40978 14.35 2.61978 12.54 2.14978 10.32C1.30978 6.43999 4.25978 2.99999 7.99978 2.99999C9.65978 2.99999 11.1398 3.68999 12.2198 4.77999L10.7098 6.28999C10.0798 6.91999 10.5198 7.99999 11.4098 7.99999H14.9998C15.5498 7.99999 15.9998 7.54999 15.9998 6.99999V3.40999C15.9998 2.51999 14.9198 2.06999 14.2898 2.69999L13.6498 3.34999Z"
                                  fill="#000000" />
                          </svg>
                          <img alt="captcha" loading="lazy" src="/@captcha@" width="88" height="35" />
                          </div>

                      </div>
                    </script>
                  </face>
                </basis>
                <div class="text-right">
                  <button
                    class="data-body-btn btn rounded-lg w-[111px] h-12"
                    onclick="checkConfirme()"
                    type="button"
                    data-btn-upload
                  >
                    ارسال
                  </button>
                </div>
              </div>
              <div class="clr"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <basis core="call" file="footer.inc" />
  </body>
</html>
